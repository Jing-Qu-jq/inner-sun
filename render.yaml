# Render blueprint for InnerSun (Features 17 and 24).
#
# This deploys ONE service: the Fastify API, which also serves the built admin UI at /admin
# and — since Feature 24 — the student-facing chat app at the origin root, both from its own
# origin. One URL for everything, so CORS is not a consideration for either.
#
# Feature 17 stood this up as an admin-only instance with `ENABLE_CHAT_ROUTES: false`, since
# an open, unauthenticated, token-spending chat endpoint on the public internet is the one
# thing a deployment must not create. Feature 24 turns it on for a PRIVATE PREVIEW — one
# reviewer, unadvertised and unindexed — and what replaces that switch is the pair of limits
# below: a per-IP rate limit and a daily spend ceiling for the whole instance.
#
# The service was called `innersun-admin` until 2026-09-02, from the months when it served only
# the researcher tool. Renamed here rather than in Render's dashboard, which refuses to edit a
# name the blueprint owns — and a name change IS a new service to Render, so the rename cost
# re-entering every `sync: false` secret and deleting the old one. Done deliberately while the
# preview link had gone to nobody; the same change a week later would break live bookmarks.
# A real domain is still Feature 21's job.
#
# The database is Supabase, not a Render Postgres: see docs/DEPLOYMENT.md for why, and for
# the steps only a human can do (creating the accounts, pasting the secrets).

services:
  - type: web
    name: innersun
    runtime: node
    plan: free
    # Free instances spin down when idle, so the first request after a quiet period takes
    # roughly 50 seconds. Acceptable for a tool two or three people open a few times a day.
    region: oregon

    # The whole monorepo is built: shared types, then the admin bundle, then the student
    # app, then the API — whose build step copies both bundles into dist/ to be served
    # (dist/public for the admin UI, dist/web for the student app).
    #
    # `build:web:hosted` rather than `build:web`: the plain one still targets the GitHub
    # Pages path from `homepage` in apps/web/package.json, and a bundle built that way
    # serves its HTML perfectly and then asks the browser for /inner-sun/static/... which
    # 404s into a blank page. The hosted build overrides PUBLIC_URL and points
    # REACT_APP_API_BASE_URL at this same origin.
    #
    # `--include=dev` is load-bearing. NODE_ENV=production below is wanted at RUNTIME (it
    # drives the secure cookie flag and the logger), but npm also reads it at install time
    # and omits devDependencies — which is where the entire toolchain lives: vite,
    # @vitejs/plugin-react, typescript, the type packages. Without this the build fails
    # part-way through with "Cannot find module 'vite'", which reads like a missing
    # dependency rather than an install that deliberately skipped it.
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build:admin && npm run build:web:hosted && npm run build:api
    startCommand: node services/api/dist/index.js

    # Render polls this to decide whether a deploy is healthy. It reports database
    # connectivity too, so a bad DATABASE_URL shows up here rather than at first login.
    healthCheckPath: /health

    envVars:
      # Pinned rather than left to Render's rolling default, so the runtime the build was
      # verified against is the one that keeps running. An unannounced default bump is a
      # build that breaks on a day nobody touched the code.
      - key: NODE_VERSION
        value: "24"

      - key: NODE_ENV
        value: production

      # ON as of Feature 24 — this is the private preview, and the chat endpoint IS the
      # product. What makes that safe is not the URL being unadvertised, it is the two
      # limits below. Do not turn this on anywhere they are absent.
      - key: ENABLE_CHAT_ROUTES
        value: "true"

      # The limits that replace ENABLE_CHAT_ROUTES=false as this instance's cost control
      # (Feature 24 AC 1). Declared here with values rather than left to code defaults so
      # what the instance may spend is reviewable in the repository.
      #
      # Per client IP: generous on purpose. It exists to stop one client looping the
      # endpoint, and it is the only limit a real person could meet — so it is sized for a
      # live demo with the inspector's comparison switch on, not for an average visitor.
      - key: CHAT_RATE_LIMIT_MAX
        value: "40"
      - key: CHAT_RATE_LIMIT_WINDOW_MS
        value: "600000"

      # For the whole instance, per UTC day, in estimated US dollars. This is the number
      # that makes the worst case finite: per-IP limiting says nothing about a hundred IPs.
      # A conversation was measured at $0.034-0.042, so $5 is roughly 120 conversations a
      # day — far more than one reviewer and a handful of researchers will produce, and a
      # bill that can be absorbed if the link ever leaks. Counted in memory, so a restart
      # resets it; see services/api/src/chat-limits.ts for why that is the right trade here.
      - key: CHAT_DAILY_BUDGET_USD
        value: "5"

      # Supabase connection string, and the OpenAI key used to embed a pattern on save.
      # sync:false means Render prompts for them in the dashboard and they are never
      # committed to this file. Use the Supabase *session pooler* URI — see DEPLOYMENT.md.
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # Supabase's Postgres presents a certificate chained to its OWN CA, not a publicly
      # trusted one, so Node rejects the connection as "self-signed certificate in
      # certificate chain" without this. Paste the CONTENTS of prod-ca-2021.crt
      # (Database Settings -> SSL Configuration -> Download certificate).
      #
      # The alternative, DATABASE_SSL_NO_VERIFY=true, leaves the connection encrypted but
      # unverified — deliberately not set here, because on this service it would apply to
      # every request the researcher makes.
      - key: DATABASE_SSL_CA
        sync: false

      # Pinned so the vectors this service writes stay comparable with the ones the seed
      # and db:reembed produce. A mismatch here yields meaningless similarity scores
      # rather than an error.
      - key: OPENAI_MODEL_EMBEDDING
        value: text-embedding-3-small

      # Where a student goes to book a real counselor (Feature 11). DELIBERATELY LEFT UNSET on
      # the private preview (decided 2026-09-02): the practice has no scheduling link yet, and
      # unset means the nudge is switched off entirely — which is a supported state, because
      # inviting someone to book and then handing them nowhere to go is worse than not asking.
      # The cost of that is real and worth knowing: no conversation invites anyone to book, so
      # the reviewer does not see the funnel half of the product. Declared here so switching it
      # on later is pasting a value in the dashboard and redeploying, nothing more. A malformed
      # value is refused at startup rather than shipped.
      - key: BOOKING_URL
        sync: false

      # Unlocks the retrieval inspector (Feature 22) for a demo. UNSET MEANS IT DOES NOT
      # EXIST: no debug payload is built and a response is byte-identical to an ordinary
      # visitor's, which is the right default and the one that fails closed. It grants READ
      # access to the Care Pattern library's titles, scores and guidance text, and nothing
      # else — it cannot author, publish or retire a pattern. Treat it as rotatable: changing
      # it here and redeploying is the whole revocation procedure.
      - key: INSPECTOR_TOKEN
        sync: false

    # PORT is injected by Render; the API reads it and binds 0.0.0.0 on that signal.
    # No SESSION_SECRET: admin sessions are rows in `admin_sessions` keyed by the SHA-256
    # of a random cookie token, not a signed stateless cookie, so there is nothing to sign.
